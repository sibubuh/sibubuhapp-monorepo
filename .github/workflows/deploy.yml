name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Tanpa ini, action memakai exit code perintah TERAKHIR saja — build
          # yang gagal tetap dilaporkan sukses asal `systemctl reload nginx`
          # di baris akhir berhasil.
          script_stop: true
          # Default-nya 10m. pnpm install + build frontend + build Strapi di VPS
          # (apalagi tanpa cache setelah ganti server) gampang melewatinya dan
          # job terbunuh di tengah build.
          command_timeout: 30m
          # Sementara: cetak detail koneksi SSH dan perintah yang dijalankan.
          # Dilepas lagi setelah deploy hijau.
          debug: true
          script: |
            # Probe paling awal. Kalau baris ini saja tidak muncul di log,
            # berarti sesi SSH-nya yang bermasalah, bukan isi skripnya.
            echo "✅ SSH OK — user=$(whoami) host=$(hostname) shell=$SHELL pwd=$(pwd)"

            export PATH=$PATH:$HOME/.local/share/pnpm

            export NVM_DIR="$HOME/.nvm"
            # Dua penjaga di satu baris ini, keduanya wajib di bawah `set -e`:
            #
            # 1. `if`, bukan `[ -s ... ] && ...` — test yang bernilai false
            #    menghentikan skrip, sedangkan kondisi `if` tidak.
            # 2. `|| true` pada sourcing-nya — di server yang nvm-nya belum
            #    punya alias `default`, nvm.sh sendiri selesai dengan status 3
            #    secara senyap (di dalamnya nvm memakai --silent). Tanpa ini
            #    deploy mati tepat di baris ini tanpa pesan apa pun.
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh" || true; fi

            echo "🟩 nvm: $(command -v nvm || echo 'TIDAK DITEMUKAN')"

            # `install`, bukan `use`. Di server yang Node 20.20.0-nya belum
            # ada, `nvm use` keluar dengan status 3 dan deploy mati sebelum
            # satu baris pun jalan. `nvm install` memasang kalau belum ada,
            # dan hanya mengaktifkan kalau sudah ada.
            nvm install 20.20.0
            echo "🟩 node: $(node -v) | pnpm: $(command -v pnpm || echo 'TIDAK DITEMUKAN') | pm2: $(command -v pm2 || echo 'TIDAK DITEMUKAN')"

            cd /var/www/sibubuhapp

            echo "📥 Sync code"
            git fetch origin
            git reset --hard origin/main

            echo "📦 Install dependencies"
            pnpm install --frozen-lockfile

            echo "🏗 Build frontend"
            pnpm --filter ./apps/frontend build

            echo "⚙️ Build backend"
            NODE_OPTIONS="--max-old-space-size=2048" pnpm --filter ./apps/backend build

            echo "🚀 Restart backend & Frontend"
            # `pm2 reload <nama>` gagal kalau prosesnya belum pernah di-start —
            # persis yang terjadi di server baru. `startOrReload` memakai
            # ecosystem.config.js di root repo: start kalau belum ada,
            # graceful reload kalau sudah jalan.
            pm2 startOrReload ecosystem.config.js --update-env

            pm2 save

            echo "♻️ Reload nginx"
            sudo systemctl reload nginx
