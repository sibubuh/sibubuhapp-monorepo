name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Tanpa ini, action memakai exit code perintah TERAKHIR saja — build
          # yang gagal tetap dilaporkan sukses asal `systemctl reload nginx`
          # di baris akhir berhasil.
          script_stop: true
          # Default-nya 10m. pnpm install + build frontend + build Strapi di VPS
          # (apalagi tanpa cache setelah ganti server) gampang melewatinya dan
          # job terbunuh di tengah build.
          command_timeout: 30m
          script: |
            export PATH=$PATH:$HOME/.local/share/pnpm

            export NVM_DIR="$HOME/.nvm"
            # Ditulis sebagai `if`, bukan `[ -s ... ] && ...`. script_stop
            # menjalankan skrip dengan `set -e`, dan di sana test yang bernilai
            # false menghentikan skrip — sedangkan kondisi `if` tidak.
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi

            nvm use 20.20.0

            cd /var/www/sibubuhapp

            echo "📥 Sync code"
            git fetch origin
            git reset --hard origin/main

            echo "📦 Install dependencies"
            pnpm install --frozen-lockfile

            echo "🏗 Build frontend"
            pnpm --filter ./apps/frontend build

            echo "⚙️ Build backend"
            NODE_OPTIONS="--max-old-space-size=2048" pnpm --filter ./apps/backend build

            echo "🚀 Restart backend & Frontend"
            pm2 reload frontend && pm2 reload strapi-backend

            pm2 save

            echo "♻️ Reload nginx"
            sudo systemctl reload nginx
