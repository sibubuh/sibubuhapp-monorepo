# Production reverse proxy for bubuh.id (frontend) and cms.bubuh.id (Strapi).
#
# This file is kept in the repo so the three settings that cost the site the
# most are reviewable: HTTP/2, compression, and cache headers on CMS uploads.
# It is NOT mounted by compose.yaml — see README.md in this directory for how
# to install it on the VPS.
#
# Measured on 2026-11-18 before these settings existed (SpeedVitals wKQTWa):
#   - uses-http2: 44 requests not served via HTTP/2, est. 4,840ms
#   - uses-text-compression: est. 381KiB
#   - cms.bubuh.id/uploads/* answered with Cache-Control: max-age=0

# Compression applies to every server block below.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
# text/html is always gzipped by nginx and must not be listed here.

server {
    # http2 here, not `http2 on;`: the VPS runs nginx 1.24.0, where the
    # standalone directive does not exist yet and nginx refuses to start.
    # Without HTTP/2 the browser opens six connections and serialises the rest;
    # the homepage ships 64 requests, so this is the largest win in this file.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name bubuh.id www.bubuh.id;

    ssl_certificate     /etc/letsencrypt/live/bubuh.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bubuh.id/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # server.mjs also gzips, but nginx strips Accept-Encoding from upstream
        # requests by default, so in practice nginx does the compressing here
        # and the Node implementation only matters when the app is reached
        # directly (local `pnpm start`, a container probe, a different proxy).
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name cms.bubuh.id;

    ssl_certificate     /etc/letsencrypt/live/cms.bubuh.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.bubuh.id/privkey.pem;

    # Strapi accepts large media; the default 1m rejects most camera uploads.
    client_max_body_size 50M;

    # Uploads carry a content hash in the filename (slider_1_c8d5070580.jpg),
    # so a given URL never changes content. Strapi's own max-age=0 made every
    # visitor re-download all 4.6MB of imagery. Overriding here rather than in
    # Strapi keeps the change in one reviewable place.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # The frontend requests these with crossorigin, so CORS must survive.
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Credentials;
        proxy_pass_header Vary;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bubuh.id www.bubuh.id cms.bubuh.id;
    return 301 https://$host$request_uri;
}
